name: Release

# Builds Linux packages when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0) and
# publishes them, with a SHA256SUMS file, as a GitHub release. The release is public at once because
# Lumen updates itself from the latest published release; a tag with a suffix (v0.2.0-rc.1) is
# published as a pre-release, which the updater ignores.
on:
  push:
    tags: ["v*"]
  # Also runnable by hand (Actions -> Release -> Run workflow) for a tag that does not exist yet: the
  # release creates the tag at the commit that was built.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release, e.g. v0.1.0 (must match the app version)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: lumen

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lumen/package-lock.json
      - run: npm ci
      - name: Build the .deb and the AppImage
        env:
          # The default sync server baked into the build; leave the variable unset for none (users can still set one).
          LUMEN_SYNC_URL: ${{ vars.LUMEN_SYNC_URL }}
          NO_STRIP: "true"
        run: npx tauri build --bundles deb,appimage
      - name: Checksums
        run: |
          cd target/release/bundle
          sha256sum deb/*.deb appimage/*.AppImage | sed 's#  .*/#  #' > SHA256SUMS
          cat SHA256SUMS
      # Proves who published the release, not just that the download wasn't corrupted (the
      # checksum above already covers that). Lumen refuses to trust SHA256SUMS without this
      # signature — see crates/lumen-core/src/update_sig.rs for the matching public key and the
      # verification it does before anything listed in SHA256SUMS is downloaded or installed.
      - name: Sign checksums
        env:
          LUMEN_RELEASE_SIGNING_KEY: ${{ secrets.LUMEN_RELEASE_SIGNING_KEY }}
          LUMEN_RELEASE_SIGNING_KEY_PASSWORD: ${{ secrets.LUMEN_RELEASE_SIGNING_KEY_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
          key_file="$(mktemp)"
          printf '%s' "$LUMEN_RELEASE_SIGNING_KEY" > "$key_file"
          printf '%s' "$LUMEN_RELEASE_SIGNING_KEY_PASSWORD" | minisign -S -s "$key_file" -m target/release/bundle/SHA256SUMS
          shred -u "$key_file"
          cat target/release/bundle/SHA256SUMS.minisig
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            lumen/target/release/bundle/deb/*.deb
            lumen/target/release/bundle/appimage/*.AppImage
            lumen/target/release/bundle/SHA256SUMS
            lumen/target/release/bundle/SHA256SUMS.minisig

  # The Flatpak bundle and the Arch package are built from the same commit and added to the release
  # the job above made. Install the bundle with `flatpak install --user lumen_*.flatpak`, the Arch
  # package with `sudo pacman -U lumen-*.pkg.tar.zst`.
  flatpak:
    name: Flatpak bundle
    needs: linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: lumen_${{ inputs.tag || github.ref_name }}_x86_64.flatpak
          manifest-path: lumen/packaging/flatpak/com.quinton.lumen.yml
          cache-key: flatpak-builder-${{ github.sha }}
          arch: x86_64
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: lumen_*.flatpak

  arch:
    name: Arch package
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Tools
        working-directory: .
        run: pacman -Syu --noconfirm git cargo nodejs npm pkgconf openssl librsvg webkit2gtk-4.1 gtk3 mpv
      - uses: actions/checkout@v4
      - name: Build as an ordinary user
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          useradd -m builder
          mkdir -p /home/builder/pkg
          cd "$GITHUB_WORKSPACE"
          tar --transform "s#^\./#Lumen-${pkgver}/#" -czf /home/builder/pkg/lumen-${pkgver}.tar.gz --exclude=./.git --exclude=./lumen/node_modules --exclude=./lumen/target .
          # Use the checkout in place of the release download.
          sed "s#^source=.*#source=(\"lumen-\$pkgver.tar.gz\")#" lumen/packaging/aur/PKGBUILD > /home/builder/pkg/PKGBUILD
          chown -R builder:builder /home/builder
          cd /home/builder/pkg
          su builder -c 'makepkg --noconfirm --skipchecksums'
          cp lumen-*.pkg.tar.* "$GITHUB_WORKSPACE/"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: lumen-*.pkg.tar.*
