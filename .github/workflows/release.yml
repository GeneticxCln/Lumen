name: Release

# Builds Linux packages when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0) and
# publishes them, with a SHA256SUMS file, as a GitHub release. The release is public at once because
# Lumen updates itself from the latest published release; a tag with a suffix (v0.2.0-rc.1) is
# published as a pre-release, which the updater ignores.
on:
  push:
    tags: ["v*"]
  # Also runnable by hand (Actions -> Release -> Run workflow) for a tag that does not exist yet: the
  # release creates the tag at the commit that was built.
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release, e.g. v0.1.0 (must match the app version)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: lumen

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lumen
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lumen/package-lock.json
      - run: npm ci
      - name: Build the .deb and the AppImage
        env:
          # The default sync server baked into the build; leave the variable unset for none (users can still set one).
          LUMEN_SYNC_URL: ${{ vars.LUMEN_SYNC_URL }}
          NO_STRIP: "true"
        run: npx tauri build --bundles deb,appimage
      - name: Checksums
        run: |
          cd target/release/bundle
          sha256sum deb/*.deb appimage/*.AppImage | sed 's#  .*/#  #' > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            lumen/target/release/bundle/deb/*.deb
            lumen/target/release/bundle/appimage/*.AppImage
            lumen/target/release/bundle/SHA256SUMS
