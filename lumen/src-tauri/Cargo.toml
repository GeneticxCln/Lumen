[package]
name = "lumen"
version = "0.1.0"
description = "A Linux-first media library and player powered by Tauri, Rust, and mpv"
authors = ["Lumen Contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lumen-core = { path = "../crates/lumen-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "chrono", "uuid", "macros"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", features = ["json", "query", "rustls"] }
url = "2"
nix = { version = "0.31", features = ["process", "signal"] }
argon2 = "0.6"
base64 = "0.23"
sha2 = "0.10"
regex = "1"
scraper = "0.27"
# Provider API tokens live in the OS keychain, never in the SQLite settings table.
# keyring 4's default `v1` feature covers macOS, Windows and Linux (Secret Service).
keyring = "4"

