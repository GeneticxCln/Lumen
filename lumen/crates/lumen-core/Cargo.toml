[package]
name = "lumen-core"
version = "0.1.0"
description = "UI-agnostic media library, playlist, search, TMDB, and sync core for Lumen"
authors = ["Lumen Contributors"]
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "sqlite", "chrono", "uuid", "macros"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", features = ["json", "query", "rustls"] }
url = "2"
nix = { version = "0.31", features = ["process", "signal"] }
argon2 = "0.6"
base64 = "0.23"
sha2 = "0.10"
regex = "1"
scraper = "0.27"
keyring = "4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
getrandom = "0.3"
data-encoding = "2"
